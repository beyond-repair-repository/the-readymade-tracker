# oscin — the OSC control-INPUT plugin.
#
# Receives OSC on a UDP port and applies core control to the running tracker via the
# ControlRouter: pause/resume, single-step, view-select, and output on/off. The network
# half of the control surface — the same commands the gui keys drive, reachable remotely
# (webui bridge, a hardware controller, a sequencer). Enable by adding [oscin] to readymade.conf.
#
# Command set (prefix is /rmt by default — same namespace as the oscout egress):
#   /rmt/pause                        · /rmt/resume       · /rmt/toggle_pause (alias /rmt/toggle)
#   /rmt/step        [n]              — advance n frames (default +1; negative steps back)
#   /rmt/seek        [n]              — jump to frame n (bare = 0: reset to the first frame; video only)
#   /rmt/view        <name>          — input | debug | processed
#   /rmt/output      <name> <on|off> — start/stop an output thread by section name (tuio2/mjpeg/oscout)
#   /rmt/trigger                     — MANUAL SCAN (the pedal): capture every settling object NOW,
#                                      skipping its settle_seconds dwell, and emit at once. Bypasses the
#                                      dwell only — an object still in motion is never captured.

[oscin]
# enabled: presence turns it on; false keeps the settings but switches it off (--oscin/--no-oscin).
enabled = true
# bind address (0.0.0.0 = accept from any host on the LAN; 127.0.0.1 = localhost only).
host = 0.0.0.0
# UDP port to listen on (distinct from the data-out ports: tuio2 3333, oscout 3400).
port = 3401
# address prefix the commands live under (match the tracker's egress prefix for one namespace).
prefix = /rmt
