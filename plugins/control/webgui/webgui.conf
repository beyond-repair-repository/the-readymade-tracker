# webgui — the browser control surface + OSC↔HTTP bridge.
#
# A dep-free HTTP server: serves the single-page UI, bridges POST /osc → OSCIn (loopback UDP,
# collecting the reply), and streams the live scene as Server-Sent Events (GET /events). The UI
# builds ITSELF from /rmt/query, so no per-parameter HTML. Open http://<host>:<port>/ in a browser.
#
# Needs [oscin] enabled (the control/param path) and, for the video underlay, [mjpeg]. Enable by
# adding [webgui] to readymade.conf.

[webgui]
enabled = true
# bind address + port for the UI HTTP server.
host = 0.0.0.0
port = 8090
# (The OSC-bridge target and the video-underlay port are NOT knobs here: the tracker wires
# them from the live [oscin] and [mjpeg] sections at build, so they can never drift.)
