# mcu — the serial (microcontroller) control input: a physical panel drives the tracker.
#
# Reads newline-terminated lines from a serial port and applies each to the SAME surfaces the OSC
# control input drives — the command inbox and the live-parameter store. So a foot pedal and a knob
# need no new plumbing.
#
# Line protocol (one command per line, case-insensitive, unknown lines ignored):
#   T                → trigger          the manual scan: capture every settled object NOW and emit
#   D <0.0..1.0>     → [efd] detail     the EFD OSC-out detail level
#
# NO dependency on Linux/macOS: a serial port is just a tty, opened with the stdlib (os + termios in
# raw mode at `baud`). pyserial is only the fallback (Windows, or a device/baud the stdlib can't take)
# and is imported lazily. If neither path opens the port, this logs and stays off; the tracker still
# runs. Enable by adding [mcu] to readymade.conf and setting `port`.

[mcu]
enabled = true
# the serial device to read. macOS: /dev/tty.usbmodem* · Linux: /dev/ttyACM0 · Windows: COM3
# Empty = nothing to open (the plugin logs and stays off).
port =
# baud rate — must match the board's firmware (Serial.begin).
baud = 115200
