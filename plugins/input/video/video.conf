# video INPUT backend — default [input] settings.
# Overridden per-key by readymade.conf, then by CLI (--source / --fps / --loop).

[input]
source = video
location = tests/videos/hands2.mp4
# playback fps: 0 = match the source (real-time); >0 = override. Motion dt comes
# from the capture PTS regardless.
fps = 30
loop = false
