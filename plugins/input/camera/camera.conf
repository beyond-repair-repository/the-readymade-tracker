# camera INPUT backend — default [camera] settings.
#
# The live camera source. Enable it with `--source camera camera1.conf` (the
# calibration tool `tools/calibrate_camera.py` writes camera1.conf, which layers
# its [camera] + [preprocess] over these defaults) or by adding a [camera] section
# to readymade.conf. `source = camera` selects this backend; the settings below are the
# camera device + its controls (NOT [input], which only carries `source`).

[camera]
# device: capture index (0, 1, …), a /dev/videoN path (Linux), or a UVC name/UID.
device = 0
# requested capture geometry — 0 = leave the driver default. The camera picks the
# nearest supported mode; the backend logs the ACTUAL width/height it got.
width = 1280
height = 720
fps = 30
# backend: auto (default) uses pyuvc/libuvc on macOS when installed (the only way
# to lock exposure/gain/WB there — the AVFoundation wall), else cv2.VideoCapture.
# Force with `uvc` / `cv2`. pyuvc is an optional dep (camera track only).
backend = auto

# --- controls -------------------------------------------------------------------
# auto_exposure is the one BOOL knob (schema-declared): true = the camera auto-
# exposes; false = manual, and then `exposure` below takes effect. The numeric
# controls are device-native units with device-specific ranges — LEAVE THEM UNSET
# (commented) to keep the camera default, or let tools/calibrate_camera.py discover
# and write them. The control shim (lib/camera_controls) applies each fail-soft:
# a control the camera lacks is logged and skipped, never a crash.
auto_exposure = true
# exposure = 156
# gain = 0
# brightness = 128
# contrast = 128
# saturation = 128
# gamma = 100
# white_balance = 4600
