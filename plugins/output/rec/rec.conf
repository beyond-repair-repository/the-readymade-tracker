# rec OUTPUT plugin — video recorder.
#
# rec/stop capture of a chosen view to recordings/<YYYYMMDD-HHMMSS>.mp4, on its own thread.
# Idle until toggled: OSCIn /rmt/rec start|stop or a webgui button. Records the PROCESSED view
# by default (the exact preprocess output, so a recording replays as a test clip with
# --no-preprocess); `view` can pick input or debug instead. Enable by adding [rec] to readymade.conf.
# The recordings/ dir is git-ignored.

[rec]
# enabled: the section being PRESENT turns the plugin on; false keeps the settings but switches it off.
enabled = true
# where the files go (created on first record).
dir = recordings
# fourcc video codec: mp4v (default, .mp4) / avc1 (H.264) / xvid / mjpg.
codec = mp4v
# which view to record — processed (default: the preprocess OUTPUT — flip+crop+lens+flatfield+mask
# baked, so the recording replays as a test video with --no-preprocess) | input (raw pre-crop
# frame, full-fidelity source footage) | debug (input masked to fg). Same views as the MJPEG stream.
view = processed
# recording frame rate written into the file (the pipeline's live fps varies; this is the playback rate).
fps = 30
# force an output resolution (px). 0 0 = record at the source frame size.
width = 0
height = 0
