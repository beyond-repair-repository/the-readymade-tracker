# oscout OUTPUT plugin — the ONE smart custom-OSC egress.
#
# Generically serializes whatever derived data is on the snapshot — the per-object
# annotations a stage wrote (features, cluster, …) plus pose — over UDP OSC, self-
# describing (address-per-field). A new @feature or a whole new producer stage just appears
# on the wire; oscout never changes. Enable by adding [oscout] to readymade.conf.
# Coexists with [tuio2] (standard protocol) + [mjpeg] (video).

[oscout]
# enabled: presence turns it on; false keeps the settings but switches off (--oscout/--no-oscout).
enabled = true
# address prefix. Messages are:
#   <prefix>/frm  <frame_idx> <count> <w> <h>      — frame header (+dims for the aspect)
#   <prefix>/<producer>/<field>  <id> <v…>         — e.g. /rmt/features/circularity 5 0.9
#   <prefix>/pose  <id> <x> <y> <theta>            — pose (coords per coord_mode)
#   <prefix>/obj  <id> <state> <conf>              — settle lifecycle + pose confidence
#   <prefix>/alv  <id…>                            — the alive set (emitted objects)
prefix = /rmt
# send: which annotation producers to emit — a comma list (features, cluster, …), or `all`
# (which includes pose). `contour` is accepted too but OPT-IN ONLY (bulky — the placed rest
# outline per object); it is NOT part of `all`.
# `pose` is a special key for the core pose message; `all` includes it + every producer.
send = all
# coord_mode: how to send the POSE x,y — normalized ([0,1] by frame dims, default) or pixel.
coord_mode = normalized
# max_fps: throttle the send rate (0 = every fresh snapshot). Annotations are small.
max_fps = 0

# destinations: THE destination setting (live) — comma list of host:port targets; EVERY packet
# is sent to each, so several clients (a SuperCollider patch + a monitor + another machine)
# watch this one stream at once. Empty = the built-in default 127.0.0.1:3400.
# destinations = 127.0.0.1:3333, 192.168.1.20:3333
