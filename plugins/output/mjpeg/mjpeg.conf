# mjpeg OUTPUT plugin — default [mjpeg] settings.
#
# A live MJPEG video stream over HTTP (multipart/x-mixed-replace). Enable by adding
# [mjpeg] to readymade.conf (these fill the defaults), or force it on with `--mjpeg` on the
# CLI (which materializes the section + sets the port). One publisher thread encodes the
# chosen view once per fresh frame; every HTTP client streams that shared buffer.
# Open http://<host>:<port>/ in a browser, VLC/OBS, or tools/tuio2_monitor --mjpeg-stream.

[mjpeg]
# enabled: the section being PRESENT (in readymade.conf) turns the plugin on; set false to keep
# the section's settings but switch it off. CLI: --mjpeg / --no-mjpeg flips this.
enabled = true
# bind address + port for the HTTP server. 0.0.0.0 = all interfaces (reachable from
# another machine); 127.0.0.1 = localhost only.
host = 0.0.0.0
port = 8080
# view: which image to stream —
#   debug (default) = the cropped input frame MASKED to-zero by observe's fg (gray > fg_threshold);
#   input           = the full pre-crop frame (crop-calibration view).
# (The object-id overlay is drawn client-side by the webgui over this video.)
view = debug
# scale: resize the streamed frame by this factor before encoding — 1.0 = full size,
# 0.5 = half (¼ the pixels → much less bandwidth/CPU). Doesn't affect overlay alignment
# (coords are normalized). <=0 is treated as 1.0.
scale = 1.0
# JPEG quality 1..100 — higher = better image, bigger frames / more bandwidth.
quality = 80
# max_fps: throttle the stream (0 = every fresh snapshot). Lower it to cap bandwidth.
max_fps = 0
