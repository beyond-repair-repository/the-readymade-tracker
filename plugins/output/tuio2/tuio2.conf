# tuio2 OUTPUT plugin — default [tuio2] settings.
#
# TUIO 2.0 over UDP: one bundle per frame (/tuio2/frm + /tok per object + optional
# /bnd + /ocg contours + /alv) plus a custom /rmt/obj sidecar (4-state + confidence).
# Enable by adding [tuio2] to readymade.conf (these fill the defaults); it runs on its own
# sender thread waiting on the SnapshotBus, decoupled from the pipeline.

[tuio2]
# enabled: the section being PRESENT (in readymade.conf) turns the plugin on; set false to keep
# the section's settings but switch it off. CLI: --tuio2 / --no-tuio2 flips this.
enabled = true
# coord_mode: normalized (TUIO [0,1], default) or pixel (raw post-preprocess px).
coord_mode = normalized
# high-resolution outer-contour geometry (/tuio2/ocg). Simplification quality comes from
# the ONE global knob [observe] contour_epsilon (every output ships the same-quality outline).
send_contours = true
# contour_source: which outline to send —
#   footprint (default) = the STABLE captured rest outline placed at the object's pose
#     (what the render draws; steady, not the per-frame blob) — recommended;
#   live = the live observed contour this frame (noisy, changes as it is occluded);
#   auto = footprint when captured, else live.
# A still-SETTLING object (not yet captured) always falls back to its live contour.
contour_source = footprint
# /tuio2/bnd per-object bounds (x, y, angle, w, h, area) — off by default (the token +
# contour usually suffice); flip on if your TUIO client wants explicit bounds.
send_bounds = false
# /rmt/obj sidecar (session id, 4-state name, pose confidence) — TUIO 2.0 has no field
# for our state/confidence, so this carries them alongside.
include_custom = false
# /tuio2/frm source label (TUIO app identifier).
source = readymade
# UDP packet ceiling (bytes). Many objects × high-res contours are split across packets
# under this cap; each packet repeats /frm + the full /alv so it stays a valid frame.
# macOS caps a datagram at net.inet.udp.maxdgram (default 9216B) — bigger sends fail with
# EMSGSIZE; keep this under it unless every host's sysctl is raised.
max_packet_bytes = 8192
# max_fps: throttle the send rate (0 = every fresh snapshot; UDP tokens are µs-cheap).
max_fps = 0

# destinations: THE destination setting (live) — comma list of host:port targets; EVERY packet
# is sent to each, so several clients (a SuperCollider patch + a monitor + another machine)
# watch this one stream at once. Empty = the built-in default 127.0.0.1:3333.
# destinations = 127.0.0.1:3333, 192.168.1.20:3333
