# ===========================================================================
# benchmark_gt.conf — the VALIDATION configuration: the ANNOTATED VIEW of the
# same recording that benchmark.conf times. Fixed and committed, like its
# sibling; benchmarks/run.py plays both.
#
# Identical to benchmark.conf in everything except [preprocess]: here the raw
# frame gets ONLY the plain crop the ground truth was annotated on (480,16) —
# no lens undistort, no flatfield; the [preprocess] section says why the
# undistorted view cannot be scored against this annotation. The tracks from
# this pass are scored against tests/videos/20260714-164508.mp4.MOT, and a
# machine PASSES at idf1 0.972x / 0 switches / settle 100%.
# ===========================================================================

[input]
# the frame source. `source` picks the backend; location/fps/loop override its defaults.
# CLI: --source KIND LOCATION · --fps · --loop.
source = video
location = tests/videos/hands2.mp4

fps = 30
[preprocess]
# THE ANNOTATED VIEW, and nothing else. The manual ground truth was made on a plain crop at
# (480,16) with no undistort, so scoring needs exactly that and no more.
#
# Undistort is OFF here even though the rig uses it, and that is geometry rather than compromise:
# it moves points up to 66 px at the frame corners and 0 at the principal point, and a 43x44
# object displaced 66 px has IoU 0.00 against its annotation. Measured - crop only scores idf1
# 0.9723 / 100% settle; adding undistort gives 0.9375 / 92.1%, losing 3 of 38 settles.
#
# flip = none because the recording IS the post-flip frame (the recorder stores it after the
# rig's flip) - flipping again would mirror it out of the annotated space.
preprocess = true
lens_enabled = false
flip = none
crop_enabled = true
crop_top_x = 480
crop_top_y = 16
crop_width = 1024
crop_height = 1024
mask_enabled = false
flatfield_enabled = false

[observe]
# object mask → blobs (findContours RETR_EXTERNAL) → association → the Observation.
# fg_threshold: gray > this is foreground. min_area: drop specks (px²). k: the ONE change scale.
# edge_ignore_margin: the RIM gate, one knob for both boundaries — reject a NEW blob within this
# frac of the frame edge OR the circular mask rim (a motion blob or an arm entering from the
# border) — the resting-motion mitigation. Visualize it with the webgui `margin` overlay. 0 = off.
fg_threshold = 65
min_area = 200
# max_area: reject MINTING a blob bigger than this px² (0 = off) — keeps a stopped arm/hand from
# becoming an object. Set it above your largest object and below a hand/arm.
max_area = 0
k = 0.05
reassoc_dist = 64
# motion_threshold/motion_frac: the per-blob MOTION gate — a blob changing more than motion_threshold
# gray-levels over motion_frac of its pixels vs the last frame is 'in motion' → it never associates
# (never hijacks an id) and never mints. Only STABLE blobs are objects. This defeats the arm hijack.
motion_threshold = 25
motion_frac = 0.10
# assoc_size_tol: reject an association when 1−min/max of blob-vs-object area exceeds this — stops an
# id migrating onto a merged/foreign blob (the arm is ~18× the stone).
assoc_size_tol = 0.5
edge_ignore_margin = 0.05

contour_epsilon = 0.5
[classify]
# the per-object state machine + capture at settle. settle_seconds = the capture debounce
# (stable this long → capture the footprint). hold_max_seconds = max pin under a moving mass.
# (The stay-then-snap memory window is [identity] pool_ttl_seconds — classify does not own a
# ttl; a carried object is held/re-claimed by identity's pool, not by a classify timer.) Seconds.
# confirm_seconds = persist this long after mint before an object is shown in output/OSC/TUIO2 (a fresh
# hover blip is withheld from all outputs; the debug overlay shows it at once). 0 = show immediately.
# commit_mode: WHEN the registry updates. 'partial' (default) = each object commits on its OWN
# settle_seconds dwell, so a quiet object updates while another is still being handled — the
# partial-update paradigm. 'global' = nothing commits until the WHOLE table has been idle for
# global_quiet_seconds, then every settled object commits in one tick: the arrangement speaks as
# ONE event (the automatic form of the /rmt/trigger pedal). Fires once per stillness; re-arms on
# motion. global_quiet_frac = the moving-pixel fraction of the whole frame that counts as idle.
commit_mode = partial
global_quiet_seconds = 1.5
global_quiet_frac = 0.002
settle_seconds = 0.72
move_debounce_seconds = 0.1
hold_max_seconds = 3.0
confirm_seconds = 0.7

[identity]
# cross-settle identity: closed-set re-acquire + gone-pool. reid (below) is an optional tie-break.
pool_ttl_seconds = 18.0
clear_frac = 0.02

[pose]
# one-shot absolute-rotation fit at settle (current shape vs the object's canonical footprint), by EFD
# phase correlation (fast, continuous angle). conf_min = min correlation confidence to accept the fit;
# below → hold the last θ. (max_fits_per_frame / symmetry_lock available, defaulted.)
# measure_rotation: LIVE on/off for the ROTATION FIT only. Placement, ids and the emitted outline
# are unaffected; θ is reported as 0. That is correct, not lossy — the footprint is re-captured at
# the object's CURRENT orientation each settle, so the turn is already baked into the shape every
# consumer draws. Off skips the priciest per-settle work; turn it off if no client reads θ.
measure_rotation = true
conf_min = 0.4

# [reid] — OPTIONAL appearance re-id, a closed-set tie-break behind geometry. NEURAL-FREE: a classical
# color+shape+size descriptor (21-d: saturation hist(8) + log-Hu(7) + 3 shape + 3 size), no onnxruntime,
# no model file. Comment the section out to disable (identity then falls back to shape + position).
# The DESCRIPTOR has no knobs (its calibration is baked); everything below is appearance POLICY.
[reid]
enabled = true
# the appearance POLICY lives here (the descriptor itself has no knobs): what the pipeline does with
# the reid cosines — claim/adopt gates, twin guard, size gate, fingerprint accumulation.
# cosine_min: the ONE appearance-adoption gate — a HIDDEN husk claims a settled blob (any distance),
# or a pooled (gone) identity is re-adopted, only if best-cosine >= this (+ uniqueness). Raised from
# the 0.6 default to match the 21-d descriptor's compressed cosine scale: keeps the same ~9% rejection
# of WRONG-object matches the 47-d had at 0.6, ~full same-object recall.
cosine_min = 0.72
# reloc_cosine_reject: appearance VETO on a geometric/proximity claim — reject it if the blob's cosine
# to the object's fingerprint is below this. Stops a stone stealing a gear's id on a place-swap
# (reid is strong at rejecting DISSIMILAR objects; look-alikes still swap). 0 = off.
reloc_cosine_reject = 0.20

[features]
# per-object shape descriptors on the annotation bus. enable = comma-list; a near-orthogonal basis —
# one feature per independent shape axis (the old set was ~8 correlated 'roundness' features). The
# list below IS the whole person-facing set; drop a word to switch that feature off. All 0..1 except
# lobe_count (a count). Three more (ellipse_variance, circle_variance, defect_depth) are SYSTEM-
# INTERNAL for reid's shape block and cannot be enabled here.
#   size=linear extent 0..1 (equivalent diameter over a reference; the ONE size definition,
#     a compound's size is measured by this same pass on its mass-scaled blend)
#   eccentricity=elongation · circularity=round-ness · rectangularity=box-ness (0 = a disc)
#   solidity=bulk/compactness · lobe_count=#prongs/m-fold · spikiness=sharpness of its 1-2 sharpest
#   OUTWARD points · reflectional_symmetry=mirror match · efd=spectrum
enable = circularity,rectangularity,solidity,eccentricity,size,lobe_count,reflectional_symmetry,spikiness,efd

[efd]
# the SHARED elliptic-Fourier spectrum (ONE computation per object, reused by the efd feature, the pose
# rotation fit, the symmetry feature + the grouper). bins = display harmonic width (the efd feature vector);
# internal consumers always get at least a hardcoded floor (24), so a small bins never starves the pose fit.
# detail = the live 0..1 adaptive-selection knob (loudest-first).
bins = 64
detail = 0.4399999976158142

[clusters]
# radial-sequencer grouping (ring + per-member polar step).
radius = 0.070
min_objects = 2
enabled = true

[grouper]
# output-side voice budget: with more than max_objects confirmed objects present, fuse the nearest
# into ≤ max_objects COMPOUND objects (mass-scaled complex-EFD contour blend) that REPLACE their
# members on every output wire — same per-object addresses, real features, shared id sequence. A
# no-op under budget. The webgui keeps the real objects (compounds drawn as the `groups` overlay).
# enabled = live on/off (off = never fuse); remove this whole section to drop the stage from the pipeline.
enabled = false
max_objects = 8

[perf]
# How many threads OpenCV may split ONE operation across. 0 = leave it alone.
#
# The pipeline's operations are SMALL (countNonZero, bitwise_and on a mask), so splitting them
# costs more than it saves, and that cost grows with core count: at its default an 8-core M1 is
# 1.18x slower and a 32-thread i9 is 1.47x slower, monotonically (4→1.06x, 8→1.19x, 16→1.36x).
#
# But preprocess does the opposite kind of work. Lens undistort is a big remap over the whole
# frame and it NEEDS threads — at 1 thread it costs 9.1 ms instead of 2.4 (M1, 1920x1080).
#
# 2 serves both: it keeps all of the remap benefit while giving up 0.12 ms of pipeline tick, and
# it was the fastest value measured on the i9. Same value on every machine, so the benchmark
# rows compare. Check yours with `benchmarks/bench_threads.py`.
#
# Speed only: the result of an operation does not depend on how many threads computed it.
cv2_threads = 2

# --------------------------------------------------------------------------- #
# I/O — control in, browser surface, video + OSC out. Original ports (as in the parent tracker).
# --------------------------------------------------------------------------- #

[oscin]
# OSC control input (/rmt/set · /rmt/query · /rmt/trigger · pause/step/view/output/rec …).
port = 3401

enabled = true
[webgui]
# browser control surface + OSC↔HTTP bridge (POST /osc → loopback UDP → oscin; SSE events).
# oscin_port / mjpeg_port default to 3401 / 8080 — they match [oscin]/[mjpeg] below.
port = 8090

enabled = false
[mjpeg]
# MJPEG-over-HTTP video output (webgui underlay).
port = 8080
enabled = false

[oscout]
# fan-out: SuperCollider on the default 3400, the monitor's features stream on 3405.
destinations = 127.0.0.1:3400, 127.0.0.1:3405
# generic OSC feature egress (/rmt/... — features / clusters / pose).

enabled = true
[rec]
# mp4 recorder (rec/stop → recordings/<timestamp>.mp4).

enabled = false
[tuio2]
enabled = true
# fan-out: SuperCollider on the standard 3333, the monitor on 3335
# (tools/tuio2_monitor.py --port 3335 --osc-port 3405). Edit live in the webgui OUTPUT panel.
destinations = 127.0.0.1:3333, 127.0.0.1:3335
# timetag_mode: /tuio2/frm's time field. 'timetag' (default) = one OSC 't' arg, the TUIO 2.0 spec
# form. 'ints' = unix SECONDS + MICROSECONDS as two int32s — COMPAT ONLY, for a client whose OSC
# parser rejects 't' (which OSC 1.0 lists as an OPTIONAL type, so a minimal parser may legitimately
# not implement it — e.g. Pd/PlugData else/osc.parse). Same instant, lossless to ~1us. Off-spec for
# TUIO, but dropping /frm costs the frame DIMENSIONS every normalized coordinate is read against.
timetag_mode = timetag
